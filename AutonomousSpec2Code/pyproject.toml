[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spec2code"
version = "0.1.0"
description = "Autonomous Spec-to-Code Pipeline with FSM Self-Correction, Sandboxed Execution, and Automated Evals (Deterministic + LLM-as-a-Judge)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "AI Engineering Learner" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
openai = [
    "openai>=1.12.0",
]
rich = [
    "rich>=13.0.0",
]

[project.scripts]
spec2code = "spec2code.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"