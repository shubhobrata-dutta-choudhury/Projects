gateway:
  name: "GuardrailProxy"
  version: "1.0.0"
  default_routing_strategy: "sla_aware_p99" # Options: sla_aware_p99, cost_optimal, weighted_round_robin
  global_sla_p99_ms: 1200.0
  max_retries: 2
  latency_window_seconds: 60
guardrails:
  pii:
    enabled: true
    rehydrate_on_output: false
    redact_entities:
      - EMAIL
      - PHONE
      - SSN
      - CREDIT_CARD
      - API_KEY
      - IP_ADDRESS
      - PERSON_NAME
  prompt_injection:
    enabled: true
    block_threshold: 0.65
    flag_threshold: 0.35
  output_verification:
    enabled: true
    min_groundedness_score: 0.55
    auto_fallback_on_hallucination: true
    enforce_json_schema: true
    block_secret_leakage: true
models:
  - id: "gpt-4o"
    provider: "openai"
    tier: "flagship"
    priority: 1
    weight: 50
    sla_p99_target_ms: 1000.0
    rpm_limit: 120
    tpm_limit: 150000
    cost_per_1k_prompt_tokens: 0.0025
    cost_per_1k_completion_tokens: 0.0100
    base_latency_ms: 320.0
    jitter_ms: 90.0
    quality_score: 0.96
  - id: "claude-3-5-sonnet"
    provider: "anthropic"
    tier: "flagship"
    priority: 1
    weight: 35
    sla_p99_target_ms: 1100.0
    rpm_limit: 100
    tpm_limit: 120000
    cost_per_1k_prompt_tokens: 0.0030
    cost_per_1k_completion_tokens: 0.0150
    base_latency_ms: 360.0
    jitter_ms: 110.0
    quality_score: 0.97
  - id: "gpt-4o-mini"
    provider: "openai"
    tier: "fast-fallback"
    priority: 2
    weight: 15
    sla_p99_target_ms: 600.0
    rpm_limit: 300
    tpm_limit: 500000
    cost_per_1k_prompt_tokens: 0.00015
    cost_per_1k_completion_tokens: 0.00060
    base_latency_ms: 140.0
    jitter_ms: 40.0
    quality_score: 0.88
